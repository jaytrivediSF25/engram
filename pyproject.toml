[project]
name = "engram"
version = "0.1.0"
description = "Anchored sliding window context manager: a pinned, LLM-compacted anchor of founding context plus a token-budgeted sliding window of recent chats"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
engram = "engram.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]
